services:
  mlflow:
    build:
      context: ../..
      dockerfile: v2/serving/Dockerfile
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow_data/mlflow.db
      --artifacts-destination /mlflow_data/artifacts
      --serve-artifacts
      --host 0.0.0.0 --port 5000
      --allowed-hosts mlflow,mlflow:5000,localhost,localhost:5000,127.0.0.1,127.0.0.1:5000
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow_data:/mlflow_data

  api:
    build:
      context: ../..
      dockerfile: v2/serving/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MODEL_DIR=/app/artifact
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MODEL_URI=models:/npl-el-price@champion
    volumes:
      - ./artifact:/app/artifact:ro
    depends_on:
      - mlflow
